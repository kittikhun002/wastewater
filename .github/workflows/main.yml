name: Auto Build and Release ESP32

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch: # เพิ่มตัวนี้เพื่อกดรันเองได้

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Run PlatformIO Build
        run: pio run

      # 🛠️ [เพิ่มสเต็ปนี้] ให้หุ่นยนต์ก๊อปปี้ไฟล์แยกเป็น 2 ชื่อ
      - name: Prepare Pre and Post Firmware Files
        run: |
          cp .pio/build/*/firmware.bin pre_firmware.bin
          cp .pio/build/*/firmware.bin post_firmware.bin

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          # 🛠️ [แก้ไขตรงนี้] สั่งให้อัปโหลดไฟล์ที่เปลี่ยนชื่อแล้วขึ้นไปแทน
          files: |
            pre_firmware.bin
            post_firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}